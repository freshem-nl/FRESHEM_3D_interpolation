  gpkg_file: '//tsn.tno.nl/RA-Data/Express/Datachris/Projecten/FreshEM_local/Interpolation/20260715_Noord_F_Noord_B2/Noord_F_proc_I02_doi_325m_MOD_inv.gpkg'

epsg: 28992
include_flightlines: true
