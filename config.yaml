name: iso
method: "geostat" # geostat, ml

# paths — set dir_base and dir_input in config.local.yaml (see config.local.yaml.example)

data_input:
  - Zuid_A1_proc_I01_MOD_inv.xyz
  # - Noord_Holland_A_proc_I01_MOD_inv.xyz
  # - Noord_Holland_B1_proc_I01_MOD_inv.xyz
  # - Noord_Holland_B2_proc_I01_MOD_inv.xyz
  # - LCI_Sharp_MOD_inv.xyz
  # - SCI_Sharp_Best_MOD_inv.xyz
  # - Noord_B2_proc_I02_DOI225m_MOD_inv.xyz
  # - Noord_F_proc_I02_doi_325m_MOD_inv.xyz

variable_name: "rho"
variable_unit: "Ohm.m"
indicators: [1,2,3,5,10,20,30,50,100]
indicator_bounds: [0.01, 150.0]
doi_name: "doi_standard"

# cl
# data_input: "ZLN-clipped_nmc250_chloride.feather"
# variable_name: "cl"
# variable_unit: "mg/l"
# indicators: [150,300,500,750,1000,1250,1500,2000,3000,5000,7500,10000,15000]
# indicator_bounds: [0.01, 30000.0]

# general variables
epsg: 28992
quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
cellsize_xy: 50
cellsize_z: 0.5
buffer_xy: 300
buffer_z: 3
xval_n_lines: 25

#geostat variables
use_anisotropy: False
variogram_model_range_xy: 1000.0
variogram_minor_range_xy_min: 100.0
neighbourhood_dist_xy: 1000.0
neighbourhood_n_sectors: 4
neighbourhood_max_neigh_per_sector: 8
    

# ml variables
rf_n_trees: 500
features: ['layer', 'OGC(7.5°)', 'OGC(22.5°)', 'OGC(37.5°)', 'OGC(52.5°)', 'OGC(67.5°)', 'OGC(82.5°)', 'OGC(97.5°)', 'OGC(112.5°)', 'OGC(127.5°)', 'OGC(142.5°)', 'OGC(157.5°)', 'OGC(172.5°)']

# plotting
plotting_layers: [1,7,15,25]
histogram_bins: 50
histogram_sample_size: 10000

# anisotropy
aniso_indicator: 5
aniso_pca_radius: 1000
aniso_pca_nmin: 20
aniso_pca_eig_ratio_min: 2.0
aniso_pca_sampling_eig_min: 2.0
aniso_pca_angle_diff_max: 15.0
aniso_idw_k: 16

# iMOD exports (written under dir_output)
export:
  idf:
    enabled: true
    properties: ["Q(0.5)"]
    # layers: [1, 2, 3]  # optional subset for quick iMOD tests
  mdf:
    enabled: true
    legend: rho_zout.leg  # file in data/leg/